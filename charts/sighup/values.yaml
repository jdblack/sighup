# Defaults for the sighup chart. Every knob is documented here; there is deliberately no
# `values.schema.json`, so read this file.

# Sighup's own image ships from ghcr (GitHub Container Registry).
image:
  repository: ghcr.io/jdblack/sighup
  # Defaults to the chart's appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: sighup

# A sighup is a singleton. Two replicas would race each other patching the same annotation, and the
# in-process lock cannot help across pods -- hence also the Recreate strategy below.
replicaCount: 1

# Sighup authenticates to the API with this token, so automount must stay true -- that is the
# entire design: no kubeconfig, no secret in git, no CI credential. It patches only the named
# Deployments in `targets` (see `rbac`), nothing else.
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# The registry host every target is watched in. One sighup watches one registry; a second registry
# is a second sighup.
registry: ghcr.io

# What to watch and roll. There is deliberately NO default: a sighup must know nothing about any
# particular app, so the release names its targets explicitly and fails loudly if it names none.
#
# Each target is one Deployment and the moving tag that drives it; sighup rolls the Deployment when
# that tag's digest moves. A single push can fan out to every target watching it, which is the point
# of running more than one.
#
# SCOPE IS THE LIST. The Role pins these Deployments by name, so the blast radius of a bug or a
# stamped-on credential is exactly what is typed here -- never a wildcard, never a namespace.
#
# `namespace` defaults to the release namespace; RBAC for a cross-namespace target lands in that
# target's namespace.
#
# targets:
#   - repository: library/someapp
#     tag: edge
#     namespace: app            # optional; defaults to the release namespace
#     deployment: someapp
#     annotation: ""            # optional; defaults to sighup/applied
targets: []


# The Role grants get+patch on the named Deployments only -- one Role per namespace, listing that
# namespace's Deployments by name. That pin IS the scope story; there is no reason to turn this off,
# and no way to widen it to a wildcard here.
rbac:
  create: true

# The poll loop. Not optional: Harbor retries a webhook only three times with a 3s timeout, so a
# missed delivery would otherwise leave the Deployment stale forever.
poll:
  interval: 15m
  timeout: 30s

# The webhook receiver. The container always listens; this only decides whether a Service fronts it
# so Harbor can POST to it. Both ends are in-cluster, so no gateway or certificate is involved.
service:
  enabled: true
  type: ClusterIP
  port: 8080
  annotations: {}

webhook:
  # Header Harbor sends and sighup compares, verbatim, in constant time.
  header: Authorization
  secret:
    # Preferred: create the Secret outside the chart (Terraform), so it never reaches Helm values
    # nor the release Secret that Helm stores them in.
    existingSecret: ""
    key: secret
    # Standalone fallback. Off by default on purpose -- a value here lands in the release Secret.
    create: false
    value: ""

# HTTP probes against sighup's own endpoints.
probes:
  liveness:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 30
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    httpGet:
      path: /readyz
      port: http
    initialDelaySeconds: 2
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

# A poll is one HTTPS HEAD plus one API get; the tool is idle the rest of the time.
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

# Never 2: a rolling update would briefly run two sighups, and the lock is per-process. Recreate
# guarantees a single writer, at the cost of a short gap where nothing is watching.
strategy: Recreate

terminationGracePeriodSeconds: 15

podAnnotations: {}
podLabels: {}

# The image already runs as the distroless `nonroot` uid; this only pins it explicitly.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Extra env vars, appended after the built-ins (list of EnvVar).
env: []

nodeSelector: {}
tolerations: []
affinity: {}

# Free-form NetworkPolicy rules; only rendered when enabled. Empty list = deny that direction.
# Two are needed for the webhook: egress to Harbor (digest reads) and the API server, and ingress
# from the Harbor namespace on `service.port`.
networkPolicy:
  enabled: false
  ingress: []
  egress: []
