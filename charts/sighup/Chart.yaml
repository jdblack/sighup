apiVersion: v2
name: sighup
description: Rolls Deployments when a registry tag's digest moves (webhook, poll, or a scheduled CronJob)
type: application
version: 0.2.0
# Manual: the Go binary carries no version string, so there is nothing for CI to guard this against.
# Bump it by hand when the app changes.
appVersion: "0.1.0"
home: https://github.com/jdblack/sighup
sources:
  - https://github.com/jdblack/sighup
keywords:
  - continuous-deployment
  - registry
  - webhook
  - harbor
  - cronjob
maintainers:
  - name: James Blackwell
    email: helm@linuxguru.net
# httpGet probes, seccompProfile and a named targetPort are stock well before this; 1.25 is the
# honest floor for a supported cluster.
kubeVersion: ">=1.25.0-0"
annotations:
  artifacthub.io/category: integration-delivery
  artifacthub.io/license: MIT
