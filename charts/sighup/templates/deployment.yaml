apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sighup.fullname" . }}
  labels:
    {{- include "sighup.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.strategy }}
  # Recreate, not RollingUpdate: a rolling update would briefly run two sighups, and the mutex that
  # serialises patches is per-process. One writer, always.
  strategy:
    type: {{ . }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "sighup.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if or .Values.webhook.secret.create .Values.podAnnotations }}
      annotations:
        {{- if .Values.webhook.secret.create }}
        # Rolls the pod when the chart-owned webhook Secret changes. Pointless (and impossible) for
        # an externally managed Secret, which is why it is gated on `create`.
        checksum/webhook-secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "sighup.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "sighup.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sighup"]
          # `serve` = webhook listener + poll loop. The poll is what makes a missed webhook a
          # non-event; `once` exists for a CronJob, which cannot receive a webhook at all.
          args: ["serve"]
          ports:
            - name: http
              containerPort: {{ include "sighup.port" . }}
              protocol: TCP
          env:
            - name: SIGHUP_REGISTRY
              value: {{ required "registry is required (the registry host every target lives in)" .Values.registry | quote }}
            # The whole target list, JSON-encoded. One var, because a list does not fit the k=v shape
            # and N indexed vars would be a worse lie.
            - name: SIGHUP_TARGETS
              value: {{ include "sighup.targets" . | quote }}
            - name: SIGHUP_LISTEN
              value: {{ printf ":%v" (include "sighup.port" .) | quote }}
            - name: SIGHUP_POLL_INTERVAL
              value: {{ .Values.poll.interval | quote }}
            - name: SIGHUP_TIMEOUT
              value: {{ .Values.poll.timeout | quote }}
            - name: SIGHUP_WEBHOOK_HEADER
              value: {{ .Values.webhook.header | quote }}
            {{- if eq (include "sighup.webhookAuthEnabled" .) "true" }}
            - name: SIGHUP_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "sighup.webhookSecretName" . }}
                  key: {{ .Values.webhook.secret.key }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
