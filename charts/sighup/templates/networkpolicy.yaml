{{- if .Values.networkPolicy.enabled }}
{{/*
Opt-in lockdown. Rules are free-form so the cluster's own conventions (the Harbor namespace peer,
node IPs for kubelet probes, DNS, the API server) win over anything invented here. Leaving a list
empty denies that direction -- remember kubelet probes arrive from the node.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sighup.fullname" . }}
  labels:
    {{- include "sighup.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sighup.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  {{- with .Values.networkPolicy.ingress }}
  ingress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.networkPolicy.egress }}
  egress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
