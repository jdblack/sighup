{{- if .Values.rbac.create -}}
{{/*
The scope story, in one rule per namespace: one API group, one resource, a NAMED list of Deployments,
two verbs. No cluster-scoped object, no wildcard -- so the worst a compromised sighup can do is
restart the Deployments this release names, and only those.

Namespaces differ, so the Roles do too: sighup groups its targets by namespace and lands one Role and
RoleBinding in each. The ServiceAccount stays with the release; a cross-namespace subject is allowed,
so a single identity is bound into every target namespace.
*/}}
{{- $root := . -}}
{{- $releaseNS := .Release.Namespace -}}
{{- $groups := dict -}}
{{- range .Values.targets -}}
{{- $n := default $releaseNS .namespace -}}
{{- $groups = set $groups $n (append (get $groups $n | default list) .deployment) -}}
{{- end -}}
{{- range $ns, $deps := $groups }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sighup.fullname" $root }}
  namespace: {{ $ns }}
  labels:
    {{- include "sighup.labels" $root | nindent 4 }}
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      {{- range $deps | uniq }}
      - {{ . | quote }}
      {{- end }}
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sighup.fullname" $root }}
  namespace: {{ $ns }}
  labels:
    {{- include "sighup.labels" $root | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "sighup.fullname" $root }}
subjects:
  - kind: ServiceAccount
    name: {{ include "sighup.serviceAccountName" $root }}
    namespace: {{ $releaseNS }}
{{- end }}
{{- end }}
