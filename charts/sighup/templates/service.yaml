{{- if and .Values.service.enabled .Values.deployment.enabled }}
{{/*
Both ends of the webhook are in-cluster -- Harbor POSTs from its own namespace -- so a ClusterIP
Service is the whole exposure. No Gateway, no certificate, no external DNS.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sighup.fullname" . }}
  labels:
    {{- include "sighup.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ include "sighup.port" . }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "sighup.selectorLabels" . | nindent 4 }}
{{- end }}
