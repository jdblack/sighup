{{- if .Values.webhook.secret.create }}
{{/*
Only rendered when the chart is asked to own the Secret. Prefer `existingSecret`: anything given
here ends up in the release's Helm-managed Secret alongside the rendered values.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sighup.webhookSecretName" . }}
  labels:
    {{- include "sighup.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.webhook.secret.key }}: {{ required "webhook.secret.value is required when webhook.secret.create is true" .Values.webhook.secret.value | quote }}
{{- end }}
